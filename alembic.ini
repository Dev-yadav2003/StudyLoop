# Alembic config. The DB URL is NOT stored here: it comes from the caller
# (tests/scripts set sqlalchemy.url) or from the DATABASE_URL env var.
[alembic]
script_location = %(here)s/src/lecnotes/storage/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
