name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who is it for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How would we know it worked?
      description: A metric, an eval, or a user-visible behaviour.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
