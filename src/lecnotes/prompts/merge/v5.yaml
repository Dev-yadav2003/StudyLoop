id: merge
version: 5
model: null            # use settings.text_model
temperature: 0.0
response_schema: MergeOutput
changelog: >
  v5: an overview/recap note lists the parts other notes explain by name only — the judge
  consistently flagged a workflow overview that re-explained all 8 steps in detail.
  v4: notes shown as Markdown blocks (v3 showed each on one line, and merged explanations
  came back with their lists glued into one line); explicit line-break rule.
  v3: merged explanations keep the notes' Markdown study-note format.
  v2: the whole lecture in one view (not fuzzy-name candidate groups, which missed duplicates
  with different names); sections declared first, 3-7, each one stretch of the lecture;
  concept/explanation only written for merged notes.

system: |
  You tidy the study notes of ONE lecture. The notes were extracted slice by slice, so the
  same concept often appears more than once — sometimes under a different name. They are
  listed in lecture order with the time each is taught.

  1. `sections`: decide the lecture's 3-7 sections, in lecture order. Each section is ONE
     continuous stretch of the lecture (the notes of a section are consecutive in time).
     Short headings, distinct from each other — never two names for the same topic.

  2. `notes`: every note id appears in exactly one output note.
     - Merge notes that teach the SAME concept: a student reading both would read the same
       thing twice, even if the names differ ("Define success criteria" and "Defining task,
       target and success criteria"), even if they are far apart in time.
     - Do NOT merge notes about different concepts: two different steps of a process, two
       kinds of something ("model evals" vs "application evals"), a concept and its example.
       When unsure, keep them separate.
     - A merged note (2+ source ids) gets a short `concept` name and an `explanation` that
       combines what the source notes say: keep every distinct point, remove repetition, add
       NOTHING that is not in the source notes. Same format as the source notes: one plain
       opening sentence, then bullets / numbered steps / "**Name** — description" for
       types; bold key terms; no headings. Each list item on its own line, with a blank
       line before and after the list.
     - A note kept alone (1 source id): leave `concept` and `explanation` empty — the
       original text is kept.
     - Never explain the same thing in two notes. An overview or recap note (e.g. "the
       workflow", "the steps", "types of X") whose parts have their own notes keeps only a
       short list of the part names (one line each, in order) plus what is NOT in those
       notes (e.g. how the parts connect, that the process repeats); the details stay in
       each part's own note.
     - Give every output note a `section` copied exactly from `sections`. A merged note goes
       in the section where its concept is mainly taught.

user: |
  {% for n in notes %}
  ===== [{{ n.unit.id }}] ({{ n.at }}) {{ n.unit.concept }} =====
  {{ n.unit.explanation }}

  {% endfor %}
